# WP-CLI as the site owner, evaluated for the current wp_update_site
wp_update__wp: >-
  {{ ['runuser', '-u', wp_update_site.user, '--', wp_update_wpcli_path, '--path=' ~ wp_update_site.path]
     + (['--allow-root'] if wp_update_site.user == 'root' else []) }}
# Without plugins/themes: works even when a plugin is broken
wp_update__wp_core: "{{ wp_update__wp + ['--skip-plugins', '--skip-themes'] }}"
# For plugin/theme listing and updates
wp_update__wp_ext: "{{ wp_update__wp if wp_update_load_plugins | bool else wp_update__wp_core }}"

wp_update__snapshot_name: "{{ wp_update_snapshot_prefix }}{{ wp_update__ts }}"

# Proxmox API connection, empty settings are left out so PROXMOX_* env vars apply
wp_update__proxmox_api: >-
  {{ {'api_host': wp_update_proxmox_api_host,
      'api_port': wp_update_proxmox_api_port,
      'api_user': wp_update_proxmox_api_user,
      'api_token_id': wp_update_proxmox_api_token_id,
      'api_token_secret': wp_update_proxmox_api_token_secret,
      'api_password': wp_update_proxmox_api_password,
      'ca_path': wp_update_proxmox_ca_path}
     | dict2items | rejectattr('value', 'in', ['', none]) | items2dict
     | combine({'validate_certs': wp_update_proxmox_validate_certs | bool}) }}
